[package]
name = "nyx-glimpse"
version = "0.1.0"
default-run = "nyx-glimpse"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
glimpse-plugin-sdk = { path = "../../crates/glimpse-plugin-sdk" }
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "4378e243aeb09733843996663cd9a5a7f0cbb821" }
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "40db521bab468d54f18f65c6aabd7fc8533d6a4d" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "40db521bab468d54f18f65c6aabd7fc8533d6a4d" }
nyx-ui-link = { git = "https://github.com/design-nexus/nyx-core.git", rev = "546ed1e3b8f53061e64565ec675ee73429ad9d50" }
nyx-actions = { git = "https://github.com/design-nexus/nyx-core.git", rev = "3e7a6989434466f0cb259028922adbba020d7b3e" }
nyx-ai-client = { git = "https://github.com/design-nexus/nyx-ai.git", rev = "9633690eee06724145be430db439244ba131825f" }
nyx-passwords-proto = { git = "https://github.com/design-nexus/nyx-passwords.git", rev = "271eac96e166f1adceecc3e3c6c0dfde027ca522", features = ["client"] }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
gtk4-layer-shell = "0.8"
gio-unix = "0.22"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.10"
libc = "0.2"
notify = "8"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "macros"] }
base64 = "0.22"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "parsing", "regex-fancy"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "time", "macros", "net", "io-util"] }
